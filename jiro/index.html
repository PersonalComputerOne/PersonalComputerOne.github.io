<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight Fright</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- PAGE HEADER -->
    <header class="site-header">
      <p class="header-label">Gallery</p>
      <h1 class="header-title">Midnight Fright</h1>
      <p class="header-sub" id="poemPreview">hover to reveal · click to open</p>
    </header>

    <!-- GALLERY GRID -->
    <main class="gallery-wrap">
      <section
        class="gallery"
        id="gallery"
        aria-label="Flower photography gallery"
      >
        <figure class="gallery-item" data-index="0" style="order: 1">
          <img
            src="pics/Daisy on Black Fine Art Black and White Photography Flower - Etsy.jpg"
            alt="Daisy on black"
            loading="lazy"
          />
        </figure>

        <figure class="gallery-item" data-index="1" style="order: 4">
          <img src="pics/Products.jpg" alt="Flower product" loading="lazy" />
        </figure>

        <figure class="gallery-item" data-index="2" style="order: 7">
          <img
            src="pics/GUILLERMO ÁLVAREZ.jpg"
            alt="Guillermo Álvarez flower"
            loading="lazy"
          />
        </figure>

        <figure class="gallery-item" data-index="3" style="order: 2">
          <img src="pics/download (3).jpg" alt="Flower" loading="lazy" />
        </figure>

        <figure class="gallery-item" data-index="4" style="order: 5">
          <img
            src="pics/soulhearts.jpg"
            alt="Soulhearts flower"
            loading="lazy"
          />
        </figure>

        <figure class="gallery-item" data-index="5" style="order: 8">
          <img
            src="pics/shinjiaratani.jpg"
            alt="Shinjiaratani flower"
            loading="lazy"
          />
        </figure>

        <figure class="gallery-item" data-index="6" style="order: 3">
          <img
            src="pics/Pin de Gardengirl en Fondo Negro _ Rosas negras, Fondos de pantalla de iphone, Flores negras.jpg"
            alt="Black roses"
            loading="lazy"
          />
        </figure>

        <figure class="gallery-item" data-index="7" style="order: 6">
          <img src="pics/photo.jpg" alt="Flower photo" loading="lazy" />
        </figure>

        <figure class="gallery-item" data-index="8" style="order: 9">
          <img src="pics/dgfd.jpg" alt="Flower" loading="lazy" />
        </figure>
      </section>
    </main>

    <!-- MODAL / LIGHTBOX -->
    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer"
    >
      <div class="modal-inner">
        <div class="modal-image-wrap">
          <button class="modal-close" id="modalClose" aria-label="Close">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
            >
              <path
                d="M1 1l12 12M13 1L1 13"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <img id="modalImg" src="" alt="" />
        </div>

        <div class="modal-poem-wrap" id="modalPoemWrap">
          <p class="modal-line" id="modalLine"></p>
          <div
            class="modal-progress"
            id="modalProgress"
            aria-hidden="true"
          ></div>
        </div>
      </div>
      <div class="modal-backdrop" id="modalBackdrop"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
